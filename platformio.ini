; Lumen — контроллер адресной ленты на ESP32.
;
;   pio run -e supermini_c3          сборка под ESP32-C3 Super Mini
;   pio run -e devkit_wroom32 -t upload
;   scripts/test_all.sh              тесты без железа (pio test -e native
;                                    не работает: нет test_custom_runner.py)

[platformio]
default_envs = devkit_wroom32

; ------------------------------------------------------------------ общее

[common]
framework = arduino
monitor_speed = 115200
; Без этой строки PlatformIO соберёт образ SPIFFS, №а прошивка монтирует
; LittleFS — интерфейс просто не найдётся.
board_build.filesystem = littlefs
monitor_filters = esp32_exception_decoder, time

lib_deps =
    makuna/NeoPixelBus @ ^2.8.3
    bblanchon/ArduinoJson @ ^7.2.0
    ESP32Async/ESPAsyncWebServer @ ^3.7.0
    ESP32Async/AsyncTCP @ ^3.3.2

build_flags =
    -std=gnu++17
    -I src
    -D LUMEN_VERSION=\"0.1.0\"
    ; HA-интеграция WLED требует прошивку 0.14.0+, поэтому /json/info
    ; рапортует совместимую версию. Наш собственный номер — в LUMEN_VERSION.
    -D WLED_COMPAT_VERSION=\"0.15.0\"
    -D CORE_DEBUG_LEVEL=2

build_unflags = -std=gnu++11

; ------------------------------------------- ESP32-C3 Super Mini (4 МБ)

[env:supermini_c3]
extends = common
platform = espressif32 @ ^6.9.0
board = esp32-c3-devkitm-1

build_flags =
    ${common.build_flags}
    -D LUMEN_BOARD=\"c3-supermini\"
    -D LED_PIN=2
    -D MAX_LEDS=300
    -D MAX_SEGMENTS=4
    ; Serial через встроенный USB-CDC — у Super Mini нет UART-моста.
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

board_build.partitions = partitions_4mb.csv

; ------------------------------------------- ESP32 DevKit WROOM-32

[env:devkit_wroom32]
extends = common
platform = espressif32 @ ^6.9.0
board = esp32dev

build_flags =
    ${common.build_flags}
    -D LUMEN_BOARD=\"wroom32\"
    -D LED_PIN=16
    -D MAX_LEDS=1200
    -D MAX_SEGMENTS=16
    ; Два ядра: рендер уезжает на core 0, сеть остаётся на core 1.
    -D LUMEN_DUAL_CORE=1

board_build.partitions = partitions_4mb.csv

; ------------------------------------------- тесты ядра на хосте

[env:native]
platform = native
test_framework = custom
build_flags = -std=c++17 -Wall -Wextra -I lib/schedule
test_build_src = no
